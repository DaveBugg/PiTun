<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We'll be right back</title>
<meta name="description" content="Scheduled maintenance in progress.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#334155 100%);color:#e2e8f0;line-height:1.6;padding:2rem}
.container{text-align:center;max-width:540px}
.icon{width:80px;height:80px;margin:0 auto 2rem;border-radius:50%;background:rgba(99,102,241,.15);display:flex;align-items:center;justify-content:center;animation:spin 4s linear infinite}
.icon svg{width:36px;height:36px;color:#a5b4fc}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
h1{font-size:clamp(1.75rem,5vw,2.5rem);font-weight:700;margin-bottom:.75rem;color:#f1f5f9}
.lede{font-size:clamp(1rem,2vw,1.15rem);color:#cbd5e0;margin-bottom:2rem}
.card{background:rgba(15,23,42,.6);border:1px solid #334155;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;text-align:left;backdrop-filter:blur(8px)}
.card dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:.25rem}
.card dd{font-size:1rem;color:#e2e8f0;font-weight:500;margin-bottom:1rem}
.card dd:last-child{margin-bottom:0}
.contact{font-size:.875rem;color:#94a3b8}
.contact a{color:#a5b4fc;text-decoration:none}
.contact a:hover{text-decoration:underline}
.dots{display:inline-block}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a5b4fc;margin:0 2px;opacity:.4;animation:pulse 1.5s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.4;transform:scale(1)}40%{opacity:1;transform:scale(1.3)}}
</style>
</head>
<body>
<main class="container">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
  </div>
  <h1>We'll be right back<span class="dots"><span></span><span></span><span></span></span></h1>
  <p class="lede">Scheduled maintenance in progress. Things should be back online shortly.</p>

  <dl class="card">
    <dt>Started at</dt><dd>April 22, 2026 · 02:00 UTC</dd>
    <dt>Estimated duration</dt><dd>~45 minutes</dd>
    <dt>What's happening</dt><dd>Database migration and a few infrastructure upgrades.</dd>
  </dl>

  <p class="contact">Updates: <a href="#">status page</a> · Questions: <a href="mailto:hello@example.com">hello@example.com</a></p>
</main>
</body>
</html>
